<table mat-table [dataSource]="data()" [border]="1">
    <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let item">{{ item.id }}</td>
    </ng-container>

    <ng-container matColumnDef="nama">
        <th mat-header-cell *matHeaderCellDef>Nama</th>
        <td mat-cell *matCellDef="let item">{{ item.nama }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Aksi</th>
        <td mat-cell *matCellDef="let item">
            <button mat-button (click)="openFormDialog(item)">
                <mat-icon>edit</mat-icon>
            </button>
            <button mat-button (click)="handleDeleteKategori(item)">
                <mat-icon>delete</mat-icon>
            </button>
        </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns()"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns();"></tr>
</table>
<button mat-raised-button color="primary" (click)="openFormDialog()">Tambah Kategori</button>
